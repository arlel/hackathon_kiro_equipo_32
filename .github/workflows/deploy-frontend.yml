name: Deploy Frontend

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "frontend/**"

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Trigger Vercel deploy hook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          if [ "$response" -ne 200 ] && [ "$response" -ne 201 ]; then
            echo "ERROR: Vercel deploy hook returned HTTP $response"
            exit 1
          fi
          echo "Deploy triggered successfully (HTTP $response)"
